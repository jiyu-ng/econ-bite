<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img"
     aria-label="상승률 둔화라는 지표 하나를 두고 흔한 오해와 올바른 해석을 비교한 도식. 상승률이 낮아졌다고 물가가 내린 것은 아니며, 작년 기저가 높았을 수 있다는 점을 함께 봐야 한다.">
  <style>
    .t   { font-family: Pretendard, system-ui, sans-serif; }
    .ttl { font-weight: 800; }
    .lbl { font-weight: 700; }
    .sub { font-weight: 500; }
  </style>
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <text x="380" y="40" text-anchor="middle" class="t ttl" font-size="21" fill="#1f2a44">"물가 상승률 둔화" 뉴스를 읽는 두 가지 방식</text>

  <!-- 출발 박스 -->
  <rect x="270" y="66" width="220" height="58" rx="14" fill="#1f2a44"/>
  <text x="380" y="92" text-anchor="middle" class="t lbl" font-size="16" fill="#ffffff">지표: 전년비 상승률이</text>
  <text x="380" y="113" text-anchor="middle" class="t lbl" font-size="16" fill="#ffd9c4">지난달보다 낮아졌다</text>

  <!-- 분기 화살표 -->
  <path d="M340 124 L210 168" stroke="#cbd5e1" stroke-width="2.5" fill="none"/>
  <path d="M420 124 L550 168" stroke="#cbd5e1" stroke-width="2.5" fill="none"/>

  <!-- 왼쪽: 흔한 오해 -->
  <rect x="60" y="172" width="300" height="200" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="210" y="203" text-anchor="middle" class="t lbl" font-size="16" fill="#64748b">흔한 오해 ✗</text>
  <text x="210" y="238" text-anchor="middle" class="t sub" font-size="14.5" fill="#334155">"물가가 내렸구나,</text>
  <text x="210" y="260" text-anchor="middle" class="t sub" font-size="14.5" fill="#334155">이제 살 만해지겠네"</text>
  <line x1="95" y1="284" x2="325" y2="284" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="210" y="312" text-anchor="middle" class="t sub" font-size="13.5" fill="#64748b">상승률↓ 를 곧바로</text>
  <text x="210" y="333" text-anchor="middle" class="t sub" font-size="13.5" fill="#64748b">가격 하락으로 착각</text>
  <text x="210" y="357" text-anchor="middle" class="t sub" font-size="12.5" fill="#94a3b8">→ 체감 물가와 어긋남</text>

  <!-- 오른쪽: 올바른 해석 -->
  <rect x="400" y="172" width="300" height="200" rx="16" fill="#fff4ee" stroke="#e8612c" stroke-width="2.5"/>
  <text x="550" y="203" text-anchor="middle" class="t lbl" font-size="16" fill="#c14e1f">함께 봐야 할 것 ✓</text>
  <text x="550" y="238" text-anchor="middle" class="t sub" font-size="14.5" fill="#7c3a1c">"작년 이맘때가</text>
  <text x="550" y="260" text-anchor="middle" class="t sub" font-size="14.5" fill="#7c3a1c">유난히 높았나?(기저)"</text>
  <line x1="435" y1="284" x2="665" y2="284" stroke="#f0b499" stroke-width="1.5"/>
  <text x="550" y="312" text-anchor="middle" class="t sub" font-size="13.5" fill="#9a5a3c">상승률↓ 라도 가격 수준은</text>
  <text x="550" y="333" text-anchor="middle" class="t sub" font-size="13.5" fill="#9a5a3c">여전히 높을 수 있다</text>
  <text x="550" y="357" text-anchor="middle" class="t sub" font-size="12.5" fill="#b07a5c">→ 지수 레벨·전월비도 확인</text>

  <text x="380" y="410" text-anchor="middle" class="t sub" font-size="12.5" fill="#94a3b8">※ 상승률(전년비)은 '작년 같은 달'과의 비교값이라, 작년 값이 높으면 올해 상승률은 낮게 나온다</text>
</svg>
