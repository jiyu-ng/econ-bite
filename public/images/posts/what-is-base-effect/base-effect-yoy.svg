<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img"
     aria-label="물가지수가 100에서 150으로 급등한 뒤 이듬해 156으로 거의 제자리인데, 전년비 상승률은 50퍼센트에서 4퍼센트로 뚝 떨어지는 막대그래프. 기저가 높아져 상승률이 낮게 나오는 기저효과.">
  <style>
    .t   { font-family: Pretendard, system-ui, sans-serif; }
    .ttl { font-weight: 800; }
    .lbl { font-weight: 700; }
    .sub { font-weight: 500; }
  </style>
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="380" y="38" text-anchor="middle" class="t ttl" font-size="21" fill="#1f2a44">가격은 여전히 높은데, 상승률은 왜 뚝 떨어질까</text>

  <!-- 기준선 -->
  <line x1="110" y1="360" x2="690" y2="360" stroke="#cbd5e1" stroke-width="2"/>
  <text x="100" y="365" text-anchor="end" class="t sub" font-size="12" fill="#94a3b8">0</text>

  <!-- 막대: 2024=100 -->
  <rect x="175" y="197" width="90" height="163" rx="6" fill="#cbd5e1"/>
  <text x="220" y="185" text-anchor="middle" class="t lbl" font-size="15" fill="#475569">지수 100</text>
  <text x="220" y="386" text-anchor="middle" class="t sub" font-size="14" fill="#334155">2024년</text>
  <text x="220" y="406" text-anchor="middle" class="t sub" font-size="12" fill="#94a3b8">기준(기저)</text>

  <!-- 막대: 2025=150 -->
  <rect x="355" y="116" width="90" height="244" rx="6" fill="#e8612c"/>
  <text x="400" y="104" text-anchor="middle" class="t lbl" font-size="15" fill="#c14e1f">지수 150</text>
  <text x="400" y="386" text-anchor="middle" class="t sub" font-size="14" fill="#334155">2025년</text>
  <text x="400" y="406" text-anchor="middle" class="t sub" font-size="12" fill="#94a3b8">급등</text>

  <!-- 막대: 2026=156 -->
  <rect x="535" y="106" width="90" height="254" rx="6" fill="#e8612c"/>
  <text x="580" y="94" text-anchor="middle" class="t lbl" font-size="15" fill="#c14e1f">지수 156</text>
  <text x="580" y="386" text-anchor="middle" class="t sub" font-size="14" fill="#334155">2026년</text>
  <text x="580" y="406" text-anchor="middle" class="t sub" font-size="12" fill="#94a3b8">거의 제자리</text>

  <!-- 전년비 배지 -->
  <g>
    <rect x="330" y="52" width="140" height="34" rx="17" fill="#fff4ee" stroke="#f0b499" stroke-width="1.5"/>
    <text x="400" y="74" text-anchor="middle" class="t lbl" font-size="15" fill="#c14e1f">전년비 +50%</text>
  </g>
  <g>
    <rect x="518" y="42" width="124" height="34" rx="17" fill="#eef7f0" stroke="#a7d8b4" stroke-width="1.5"/>
    <text x="580" y="64" text-anchor="middle" class="t lbl" font-size="15" fill="#16a34a">전년비 +4%</text>
  </g>

  <!-- 하단 주석 -->
  <text x="380" y="440" text-anchor="middle" class="t sub" font-size="12.5" fill="#64748b">2025년에 기준값(기저)이 100→150으로 뛰자, 2026년엔 가격이 더 높은데도 상승률은 낮게 나온다</text>
  <text x="380" y="460" text-anchor="middle" class="t sub" font-size="11.5" fill="#94a3b8">※ 개념 이해용 가상 예시 · 단위: 지수(2024년=100) / 전년동기 대비 상승률</text>
</svg>
